name: Lead Hunter

on:
  schedule:
    # - cron: '0 6 * * 1-5'  # DISABLED - focusing on BI only  # Mon-Fri at 06:00 UTC (08:00 Cyprus, before blog and social)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic httpx

      - name: Run Lead Hunter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python lead_hunter.py

      - name: Save leads
        if: always()
        run: |
          git config user.name "Vivameda Lead Hunter"
          git config user.email "leads@vivameda.com"
          git add leads/ 2>/dev/null || true
          git diff --staged --quiet || {
            git commit -m "New leads - $(date +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push || true
          }

      - name: Email CSV
        if: success()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -f leads/pipeline.csv ]; then
            python3 << 'PYEOF'
          import smtplib
          import os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime

          msg = MIMEMultipart()
          msg["From"] = "nold.oliver@gmail.com"
          msg["To"] = "oli@vivameda.com"
          msg["Cc"] = "joseph@vivameda.com"
          msg["Subject"] = f"Vivameda Lead Pipeline - {datetime.now().strftime('%Y-%m-%d')}"

          body = "Fresh leads attached. Check the pipeline CSV.\n\n- Vinnie"
          msg.attach(MIMEText(body, "plain"))

          with open("leads/pipeline.csv", "rb") as f:
              part = MIMEBase("application", "octet-stream")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", f"attachment; filename=vivameda_leads_{datetime.now().strftime('%Y%m%d')}.csv")
              msg.attach(part)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login("nold.oliver@gmail.com", os.environ["GMAIL_APP_PASSWORD"])
              server.sendmail("nold.oliver@gmail.com", ["oli@vivameda.com", "joseph@vivameda.com"], msg.as_string())
              print("Email sent successfully")
          PYEOF
          fi

      - name: WhatsApp summary
        if: success()
        run: |
          curl -s "https://api.textmebot.com/send.php?recipient=35799909204&text=Vinnie+here.+Lead+Hunter+done.+CSV+sent+to+your+email.+Go+check+oli@vivameda.com+boss.&apikey=wdXW78gEZEFt"

      - name: WhatsApp failure
        if: failure()
        run: |
          curl -s "https://api.textmebot.com/send.php?recipient=35799909204&text=Vinnie+here.+Lead+Hunter+crashed.+Check+GitHub+Actions.&apikey=wdXW78gEZEFt"
