name: Daily Social Posts

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run social media agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN_LISA: ${{ secrets.LINKEDIN_ACCESS_TOKEN_LISA }}
          LINKEDIN_BIZ_ACCESS_TOKEN: ${{ secrets.LINKEDIN_BIZ_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BIZ_API_KEY: ${{ secrets.X_BIZ_API_KEY }}
          X_BIZ_API_SECRET: ${{ secrets.X_BIZ_API_SECRET }}
          X_BIZ_ACCESS_TOKEN: ${{ secrets.X_BIZ_ACCESS_TOKEN }}
          X_BIZ_ACCESS_SECRET: ${{ secrets.X_BIZ_ACCESS_SECRET }}
        run: python social_agent.py

      - name: Save history files
        run: |
          git config user.name "Vivameda Social Bot"
          git config user.email "social@vivameda.com"
          git add .topic_history.json .style_history.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update topic/style history"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: WhatsApp success
        if: success()
        run: |
          MSGS=("Vinnie+here.+LinkedIn+and+X+are+fed.+Go+check+your+empire+boss." "It's+Vinnie.+Posted+on+LinkedIn+and+X.+You+can+thank+me+later." "Vinnie+reporting.+Social+posts+are+live.+Another+day+another+banger." "Yo+it's+Vinnie.+LinkedIn+and+X+just+got+blessed.+You're+welcome." "Vinnie+done.+Posts+live.+Images+attached.+I+don't+even+need+coffee.")
          MSG=${MSGS[$RANDOM % ${#MSGS[@]}]}
          curl -s "https://api.callmebot.com/whatsapp.php?phone=4915129005414&text=$MSG&apikey=5944134"

      - name: WhatsApp failure
        if: failure()
        run: |
          curl -s "https://api.callmebot.com/whatsapp.php?phone=4915129005414&text=Vinnie+here+and+I+messed+up.+Social+posts+broke.+Go+check+GitHub+Actions+before+I+make+it+worse.&apikey=5944134"
