name: X Engagement

on:
  schedule:
    # 3 runs per day, weekdays only
    # 09:00 UTC (11:00 Cyprus)
    - cron: '0 9 * * 1-5'
    # 13:00 UTC (15:00 Cyprus)
    - cron: '0 13 * * 1-5'
    # 18:00 UTC (20:00 Cyprus)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

jobs:
  engage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests requests-oauthlib anthropic httpx

      - name: Run X engagement
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BIZ_API_KEY: ${{ secrets.X_BIZ_API_KEY }}
          X_BIZ_API_SECRET: ${{ secrets.X_BIZ_API_SECRET }}
          X_BIZ_ACCESS_TOKEN: ${{ secrets.X_BIZ_ACCESS_TOKEN }}
          X_BIZ_ACCESS_SECRET: ${{ secrets.X_BIZ_ACCESS_SECRET }}
        run: python x_engagement.py
