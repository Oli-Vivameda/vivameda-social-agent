name: X Engagement

on:
  schedule:
    - cron: '0 7,9,11,13,15,17,19,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run X engagement agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python x_engagement.py

      - name: Save history files
        if: always()
        run: |
          git config user.name "Vivameda Engagement Bot"
          git config user.email "engagement@vivameda.com"
          git add .follow_history.json .style_history.json .topic_history.json .credits_empty 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update engagement history"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: WhatsApp failure
        if: failure()
        run: |
          curl -s "https://api.callmebot.com/whatsapp.php?phone=4915129005414&text=Vinnie+here.+X+engagement+just+face-planted.+Likes+and+follows+are+down.+I+need+help+boss.+Check+GitHub+Actions.&apikey=5944134"
